<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="dark light" />
    <title>Agent hub</title>
    <link rel="icon" href="data:," />
    <link rel="stylesheet" href="/css/app.css" />
  </head>
  <body>
    <a class="skip-link" href="#rail" data-skip="rail">Skip to agents</a>
    <a class="skip-link" href="#chat" data-skip="chat">Skip to chat</a>
    <header class="bar">
      <h1>Agent hub</h1>
      <div class="seg" role="group" aria-label="Theme">
        <button type="button" data-theme-set="auto" aria-pressed="true">System</button>
        <button type="button" data-theme-set="dark" aria-pressed="false">Dark</button>
        <button type="button" data-theme-set="light" aria-pressed="false">Light</button>
      </div>
    </header>
    <div class="shell">
      <nav class="rail" id="rail" tabindex="-1" aria-label="Agents"></nav>
      <main class="main">
        <div
          class="stage"
          id="stage3d"
          role="button"
          tabindex="0"
          aria-expanded="false"
          aria-describedby="hint"
          data-state="idle"
          data-gl="none"
        >
          <canvas aria-hidden="true"></canvas>
          <p class="nogl" role="status">3D view needs WebGL 2</p>
          <div class="info">
            <h2 data-agent-name></h2>
            <p data-agent-role></p>
            <span class="status" data-status data-now="idle">Idle</span>
          </div>
          <p class="perf" id="perf"></p>
          <p class="hint" id="hint">Click the orb to expand</p>
        </div>
        <section class="chat" id="chat" tabindex="-1" aria-label="Chat"></section>
      </main>
    </div>
    <div class="sr-only" id="announcer" role="status" aria-live="polite" aria-atomic="true"></div>
    <script src="/vendor/three.min.js"></script>
    <script src="/js/streamstate.js"></script>
    <script src="/js/apollostate.js"></script>
    <script src="/js/app.js"></script>
  </body>
</html>
